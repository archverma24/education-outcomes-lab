name: Pipeline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Check profile on the public UCI dataset
        if: github.event_name == 'pull_request'
        run: |
          education-outcomes --download
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          report = json.loads(Path("reports/baseline.json").read_text())
          profile = report["data_profile"]
          validation = json.loads(Path("reports/validation.json").read_text())
          assert validation["status"] == "valid"
          assert validation["row_count"] == profile["row_count"]
          assert validation["issues"] == []
          assert validation["source_sha256"] == report["sha256"]
          assert report["provenance"]["course"] == "Portuguese"
          assert profile["row_count"] == 649
          assert profile["column_count"] == len(profile["column_types"])
          for grade in ("G1", "G2", "G3"):
              assert profile["missing_counts"][grade] == 0
              assert profile["numeric_summary"][grade]["count"] == profile["row_count"]
              assert profile["numeric_summary"][grade]["mean"] is not None
          audit = profile["duplicate_audit"]
          assert audit["rows_checked"] == profile["row_count"]
          assert audit["rows_removed"] == 0
          assert audit["exact_duplicate_rows"] == int(
              pd.read_csv("data/raw/student-por.csv", sep=";")
              .duplicated(keep="first").sum()
          )
          PY
