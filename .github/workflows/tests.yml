name: Pipeline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Install dashboard test dependencies
        if: github.event_name == 'pull_request'
        run: pip install -e '.[app]'
      - name: Check profile and dashboard on the public UCI dataset
        if: github.event_name == 'pull_request'
        run: |
          education-outcomes --download
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          report = json.loads(Path("reports/baseline.json").read_text())
          profile = report["data_profile"]
          validation = json.loads(Path("reports/validation.json").read_text())
          assert validation["status"] == "valid"
          assert validation["row_count"] == profile["row_count"]
          assert validation["issues"] == []
          assert validation["source_sha256"] == report["sha256"]
          assert report["provenance"]["course"] == "Portuguese"
          assert profile["row_count"] == 649
          assert profile["column_count"] == len(profile["column_types"])
          for grade in ("G1", "G2", "G3"):
              assert profile["missing_counts"][grade] == 0
              assert profile["numeric_summary"][grade]["count"] == profile["row_count"]
              assert profile["numeric_summary"][grade]["mean"] is not None
          audit = profile["duplicate_audit"]
          assert audit["rows_checked"] == profile["row_count"]
          assert audit["rows_removed"] == 0
          assert audit["exact_duplicate_rows"] == int(
              pd.read_csv("data/raw/student-por.csv", sep=";")
              .duplicated(keep="first").sum()
          )
          from streamlit.testing.v1 import AppTest

          dashboard = AppTest.from_file(Path.cwd() / "app.py", default_timeout=10).run()
          assert not dashboard.exception
          assert "Data quality" in [heading.value for heading in dashboard.subheader]
          metrics = {metric.label: metric.value for metric in dashboard.metric}
          assert int(metrics["Rows checked"]) == profile["row_count"]
          assert metrics["Schema checks"] == "Passed"
          assert int(metrics["Exact duplicate rows"]) == audit["exact_duplicate_rows"]
          assert len(dashboard.json) >= 1
          assert int(metrics["Records in chart"]) == profile["row_count"]
          full_model_mae = metrics["Model MAE (grade points)"]
          source = pd.read_csv("data/raw/student-por.csv", sep=";")
          assert "School-level grade summaries" in [
              heading.value for heading in dashboard.subheader
          ]
          school_table = dashboard.dataframe[1].value
          assert list(school_table["School"]) == sorted(source["school"].unique())
          expected = source.groupby("school")["G3"].agg(["size", "mean", "median"])
          for _, row in school_table.iterrows():
              school = row["School"]
              assert int(row["Course records"]) == int(expected.loc[school, "size"])
              assert abs(row["Mean G3 (grade points)"] - expected.loc[school, "mean"]) < 1e-12
              assert abs(row["Median G3 (grade points)"] - expected.loc[school, "median"]) < 1e-12
              source_grades = source.loc[source["school"] == school, "G3"]
              assert abs(row["Range G3 (grade points)"] - (
                  source_grades.max() - source_grades.min()
              )) < 1e-12
          assert int(school_table["Course records"].sum()) == profile["row_count"]
          from io import StringIO
          from education_outcomes.exploration import school_grade_summary_csv

          exported = pd.read_csv(StringIO(school_grade_summary_csv(school_table)))
          pd.testing.assert_frame_equal(exported, school_table, check_exact=False, atol=1e-12)
          assert "Download school summary (CSV)" in [
              button.label for button in dashboard.download_button
          ]
          assert "Final-grade outlier inspection" in [
              heading.value for heading in dashboard.subheader
          ]
          q1, q3 = source["G3"].quantile([0.25, 0.75])
          iqr = q3 - q1
          expected_flagged = int((source["G3"] < q1 - 1.5 * iqr).sum()) + int(
              (source["G3"] > q3 + 1.5 * iqr).sum()
          )
          assert int(metrics["Records outside IQR fences"]) == expected_flagged
          dashboard.selectbox[0].set_value("GP").run()
          assert not dashboard.exception
          filtered = {metric.label: metric.value for metric in dashboard.metric}
          assert int(filtered["Records in chart"]) == int((source["school"] == "GP").sum())
          assert int(filtered["Course records"]) == profile["row_count"]
          assert filtered["Model MAE (grade points)"] == full_model_mae
          assert int(filtered["Missing cells"]) == 0

          source_path = Path("data/raw/student-por.csv")
          original_bytes = source_path.read_bytes()
          try:
              synthetic = source.head(20).copy()
              synthetic.loc[synthetic.index[0], "G1"] = float("nan")
              synthetic.to_csv(source_path, sep=";", index=False)
              invalid_dashboard = AppTest.from_file(
                  Path.cwd() / "app.py", default_timeout=10
              ).run()
              assert not invalid_dashboard.exception
              assert "Missing values by column" in [
                  heading.value for heading in invalid_dashboard.subheader
              ]
              invalid_metrics = {
                  metric.label: metric.value for metric in invalid_dashboard.metric
              }
              assert int(invalid_metrics["Rows checked"]) == 20
              assert invalid_metrics["Schema checks"] == "Failed"
              assert int(invalid_metrics["Missing cells"]) == 1
              assert "Model MAE (grade points)" not in invalid_metrics
              assert any("G1" in error.value for error in invalid_dashboard.error)
          finally:
              source_path.write_bytes(original_bytes)
          PY
